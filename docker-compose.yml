version: '3.8'

services:
  web:
    build: .
    container_name: billmymed-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_CONFIG=production
      - FLASK_APP=run.py
      - SECRET_KEY=billmymed-production-secret-2024
      - DATABASE_URL=sqlite:///billmymed.db
      - PORT=5000
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: billmymed-network
